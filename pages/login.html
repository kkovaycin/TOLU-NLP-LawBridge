<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LawBridge Giriş</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <div class="container">
        <!-- SOL TARAF -->
        <div class="left">
            <h2>GİRİŞ YAP</h2>
            <p>LawBridge'e hoş geldiniz. Lütfen giriş bilgilerinizi girin.</p>

            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="login()">Giriş Yap</button>

            <a href="register.html" onclick="localStorage.setItem('registerSource', 'login')">Hesabınız yok mu? <strong>
                    Kayıt olun </strong> </a>
            <a href="guest-options.html"> Misafir olarak devam et</a>

        </div>

        <!-- SAĞ TARAF -->
        <div class="right">

        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const user = JSON.parse(localStorage.getItem("user_" + email));
            if (user && user.password === password) {
                localStorage.setItem("username", user.name);
                localStorage.setItem("isLoggedIn", "true");

                // ✅ Her zaman bağlama ekranına gönder
                window.location.href = "connect-account.html";
            } else {
                alert("E-posta veya şifre hatalı.");
            }
        }


    </script>

</body>

</html>
