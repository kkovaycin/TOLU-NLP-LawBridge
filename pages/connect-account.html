<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosyal Medya Hesabını Bağla</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/connect-account.css" />
</head>

<body>

  <!-- HEADER -->
    <header class="header">
        <a href="../index.html#top" class="brand-name">LawBridge</a>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="nav" id="nav">
            <a href="../index.html#about">Hakkımızda</a>
            <a href="../index.html#team">Ekipten Mesaj</a>
            <a href="../pages/connect-account.html">Analiz Et</a>
            <a href="login.html">Giriş / Misafir</a>
        </nav>
    </header>
   
    <div class="selection-area">


      <div class="box">
    <h2>🔗 Sosyal Medya Hesabını Bağla</h2>
    <p class="info">LawBridge sisteminin yorumları analiz edebilmesi için sosyal medya hesabını bağlaman gerekiyor. Bu işlem güvenli OAuth protokolüyle gerçekleştirilir.</p>

    <!-- Kullanım Modu Seçimi -->
    <label>Kullanım Modunu Seç:</label>
    <div class="radio-group">
      <label><input type="radio" name="mode" value="duzenli"> Düzenli Mod</label>
      <label><input type="radio" name="mode" value="duzensiz"> Düzensiz Mod</label>
    </div>

    <label for="platform">Hesabını bağlamak istediğin sosyal medya platformunu seç:</label>
    <select id="platform">
      <option value="twitter">X (Twitter)</option>
      <option value="youtube">YouTube</option>
      <option value="instagram">Instagram</option>
      <option value="tiktok">TikTok</option>
    </select>

    <div id="modeInfo" class="info"></div>

    <div id="frequencyOptions" style="display:none">
      <label>Ne sıklıkla yorumlarını analiz etmemizi istersin?</label>
      <div class="radio-group">
        <label><input type="radio" name="frequency" value="daily"> Günlük</label>
        <label><input type="radio" name="frequency" value="weekly"> Haftalık</label>
        <label><input type="radio" name="frequency" value="monthly"> Aylık</label>
      </div>
    </div>

    <button class="btn" onclick="connectAccount()">Hesabımı Bağla ve Yetkilendir</button>
  </div>
    </div>
  

  <script>
    const freq = document.getElementById("frequencyOptions");
    const modeInfo = document.getElementById("modeInfo");

    document.querySelectorAll('input[name="mode"]').forEach((radio) => {
      radio.addEventListener("change", function () {
        const selectedMode = this.value;
        localStorage.setItem("usageMode", selectedMode);

        if (selectedMode === "duzenli") {
          freq.style.display = "block";
          modeInfo.innerHTML = "<strong>Düzenli Mod:</strong> Hesap periyodik olarak analiz edilecek.";
        } else {
          freq.style.display = "none";
          modeInfo.innerHTML = "<strong>Düzensiz Mod:</strong> Tek seferlik analiz yapılacak.";
        }
      });
    });

    function connectAccount() {
      const platform = document.getElementById("platform").value;
      const mode = localStorage.getItem("usageMode") || document.querySelector('input[name="mode"]:checked')?.value;
      const frequency = document.querySelector('input[name="frequency"]:checked')?.value || null;

      console.log("Platform:", platform);
      console.log("Mod:", mode);
      console.log("Sıklık:", frequency);

      alert("Bağlantı kurma işlemi başlatılıyor...");
    }
  </script>
</body>

</html>
