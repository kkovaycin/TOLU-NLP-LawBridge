<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LawBridge Kayıt</title>
    <link rel="stylesheet" href="../styles/global.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--header-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 70vh;

            display: flex;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(132, 44, 44, 0.1);
            position: relative;
            flex-direction: row;
        }

        .left {
            flex: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .left h2 {
            font-family: 'Sansation', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #111;
        }

        .left p {
            font-size: 0.95rem;
            margin-bottom: 2rem;
            color: #666;
        }

        .left input {
            padding: 0.8rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }

        .left button {
            padding: 0.9rem;
            border: none;
            background-color: rgba(30, 23, 23, 0.25);
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .left a {
            display: block;
            font-size: 0.9rem;
            color: var(--text-primary);
            text-decoration: none;
            margin-top: 0.6rem;
        }

        .left a:hover {
            opacity: 0.8;
        }

        .right {
            flex: 1;
            background: linear-gradient(to bottom right, rgba(61, 47, 47, 0.25));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: visible;
            background-image: url('../assets/images/justice_lady.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 1rem;
            }

            .left {
                padding: 2rem 1.5rem;
                width: 100%;
            }

            .left h2 {
                font-size: 1.6rem;
            }

            .left p {
                font-size: 0.9rem;
            }

            .left input,
            .left button {
                font-size: 1rem;
                width: 100%;
            }

            .right {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- SOL TARAF -->
        <div class="left">
            <h2>KAYIT OL</h2>
            <p>Yeni bir hesap oluşturmak üzeresiniz. Lütfen bilgilerinizi girin.</p>

            <input type="text" id="name" placeholder="Kullanıcı Adı">
            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="register()">Kayıt Ol</button>

            <a href="login.html">Zaten hesabınız var mı? <strong> Giriş Yapın </strong></a>
            <a href="../index.html">Misafir olarak devam et</a>
        </div>

        <!-- SAĞ TARAF -->
        <div class="right"></div>
    </div>

    <script>
        function register() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (name && email && password) {
                const user = {
                    name,
                    email,
                    password
                };
                localStorage.setItem("user_" + email, JSON.stringify(user));
                alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                window.location.href = "login.html";
            } else {
                alert("Lütfen tüm alanları doldurun.");
            }
        }
    </script>

</body>

</html>
